services:

  # ========== Init: multicast fixes for the bridges ==========
  #
  # By default Docker sets multicast_snooping=1 on each bridge,
  # and bridge-nf-call-iptables=1 on the host.

  init-bridges:
    image: alpine:3.20
    container_name: ecmp-init-bridges
    network_mode: host
    privileged: true
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        echo "[init-bridges] disabling bridge-nf-call (global)"
        echo 0 > /proc/sys/net/bridge/bridge-nf-call-iptables
        echo 0 > /proc/sys/net/bridge/bridge-nf-call-ip6tables
        echo 0 > /proc/sys/net/bridge/bridge-nf-call-arptables
        echo "[init-bridges] disabling multicast_snooping on br-* bridges"
        for b in $$(ls /sys/class/net | grep -E "^br-"); do
          if echo 0 > /sys/class/net/$$b/bridge/multicast_snooping 2>/dev/null; then
            echo "  $$b: snooping off"
          fi
        done
        echo "[init-bridges] done"

  # ========== Hosts ==========

  h1:
    build:
      context: .
      dockerfile: Dockerfile.host
    container_name: h1
    hostname: h1
    cap_add:
      - NET_ADMIN
    environment:
      HOSTNAME_ROLE: h1
      GATEWAY: 10.0.1.1
      SECONDARY_CIDR: 10.99.0.1/16
    depends_on:
      init-bridges:
        condition: service_completed_successfully
    volumes:
      - ./tests/helpers:/helpers:ro
    networks:
      br-h1r1:
        ipv4_address: 10.0.1.10

  h2:
    build:
      context: .
      dockerfile: Dockerfile.host
    container_name: h2
    hostname: h2
    cap_add:
      - NET_ADMIN
    environment:
      HOSTNAME_ROLE: h2
      GATEWAY: 10.0.2.1
    depends_on:
      init-bridges:
        condition: service_completed_successfully
    networks:
      br-r4h2:
        ipv4_address: 10.0.2.10

  # ========== Routers ==========

  r1:
    build:
      context: .
      dockerfile: Dockerfile.frr
    container_name: r1
    hostname: r1
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.fib_multipath_hash_policy: 0
      # Disable the RPF check - H1 sends from arbitrary Src IPs in 10.99.0.0/16,
      # for which the routers have no route
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
    environment:
      ROUTER_NAME: r1
      ROUTER_ID: 1.1.1.1
      IFACE_MAP: '{"10.0.1.1":"to-h1","10.0.12.1":"to-r2","10.0.13.1":"to-r3"}'
    volumes:
      - ./topology/frr-r1.conf:/etc/frr/frr.conf:ro
    depends_on:
      init-bridges:
        condition: service_completed_successfully
    networks:
      br-h1r1:
        ipv4_address: 10.0.1.1
      br-r1r2:
        ipv4_address: 10.0.12.1
      br-r1r3:
        ipv4_address: 10.0.13.1

  r2:
    build:
      context: .
      dockerfile: Dockerfile.frr
    container_name: r2
    hostname: r2
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
    environment:
      ROUTER_NAME: r2
      ROUTER_ID: 2.2.2.2
      IFACE_MAP: '{"10.0.12.2":"to-r1","10.0.24.1":"to-r4"}'
    volumes:
      - ./topology/frr-r2.conf:/etc/frr/frr.conf:ro
    depends_on:
      init-bridges:
        condition: service_completed_successfully
    networks:
      br-r1r2:
        ipv4_address: 10.0.12.2
      br-r2r4:
        ipv4_address: 10.0.24.1

  r3:
    build:
      context: .
      dockerfile: Dockerfile.frr
    container_name: r3
    hostname: r3
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
    environment:
      ROUTER_NAME: r3
      ROUTER_ID: 3.3.3.3
      IFACE_MAP: '{"10.0.13.2":"to-r1","10.0.34.1":"to-r4"}'
    volumes:
      - ./topology/frr-r3.conf:/etc/frr/frr.conf:ro
    depends_on:
      init-bridges:
        condition: service_completed_successfully
    networks:
      br-r1r3:
        ipv4_address: 10.0.13.2
      br-r3r4:
        ipv4_address: 10.0.34.1

  r4:
    build:
      context: .
      dockerfile: Dockerfile.frr
    container_name: r4
    hostname: r4
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
    environment:
      ROUTER_NAME: r4
      ROUTER_ID: 4.4.4.4
      IFACE_MAP: '{"10.0.24.2":"to-r2","10.0.34.2":"to-r3","10.0.2.1":"to-h2"}'
    volumes:
      - ./topology/frr-r4.conf:/etc/frr/frr.conf:ro
    depends_on:
      init-bridges:
        condition: service_completed_successfully
    networks:
      br-r2r4:
        ipv4_address: 10.0.24.2
      br-r3r4:
        ipv4_address: 10.0.34.2
      br-r4h2:
        ipv4_address: 10.0.2.1

  # ========== Runner (orchestrates the tests via docker exec) ==========
  #
  # Not attached to any br-* — the topology is driven through docker.sock.

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: runner
    hostname: runner
    depends_on:
      init-bridges:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tests:/tests
      - ./reports:/reports

# ========== Bridges (per-link) ==========

networks:
  br-h1r1:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.0.1.0/24
          gateway: 10.0.1.254
  br-r1r2:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.0.12.0/29
          gateway: 10.0.12.3    # dummy gateway, since Docker would otherwise auto-assign 10.0.12.1
  br-r1r3:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.0.13.0/29
          gateway: 10.0.13.3   # dummy gateway, since Docker would otherwise auto-assign 10.0.13.1
  br-r2r4:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.0.24.0/29
          gateway: 10.0.24.3    # dummy gateway, since Docker would otherwise auto-assign 10.0.24.1
  br-r3r4:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.0.34.0/29
          gateway: 10.0.34.3    # dummy gateway, since Docker would otherwise auto-assign 10.0.34.1
  br-r4h2:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.0.2.0/24
          gateway: 10.0.2.254
